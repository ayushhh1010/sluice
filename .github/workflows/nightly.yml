name: nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: as many seeds as fit in 45 minutes (20,000+ on a 4-core runner)
        run: |
          go build -o bin/ ./cmd/sluice-sim
          bin/sluice-sim -seeds 100000 -budget 45m -start "$(date +%s)000" -json sim-nightly.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: sim-nightly, path: sim-nightly.json }

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - { pkg: ./internal/kbatch, fn: FuzzSplit }
          - { pkg: ./internal/segment, fn: FuzzParse }
          - { pkg: ./internal/sequencer, fn: FuzzApply }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test -run '^$' -fuzz ${{ matrix.target.fn }} -fuzztime 10m ${{ matrix.target.pkg }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: "fuzz-${{ matrix.target.fn }}", path: "**/testdata/fuzz/**" }

  r2-probe:
    if: vars.R2_PROBE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: R2 still honours put-if-absent (16 concurrent writers, exactly one winner)
        env:
          SLUICE_TEST_S3: ${{ secrets.R2_PROBE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: go test -run TestS3 -count=1 -v ./internal/objstore

  live-chaos:
    if: vars.CHAOS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: 30 minutes of agent kills (and one sequencer kill) against the deployed cluster
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          install -m 600 /dev/null ~/key && printf '%s\n' "$SSH_KEY" > ~/key
          SSH="ssh -i $HOME/key -o StrictHostKeyChecking=accept-new $TARGET"
          go build -o bin/ ./cmd/sluice-chaos
          bin/sluice-chaos -b "k1.$DOMAIN:9093,k2.$DOMAIN:9094" -tls -user admin -pass "$ADMIN_PASSWORD" -duration 30m \
            -kill "$SSH 'cd ~/sluice/deploy && docker compose kill agent-{n} && docker compose up -d agent-{n}'" \
            -kill-sequencer "$SSH 'cd ~/sluice/deploy && docker compose kill sequencer-a && docker compose up -d sequencer-a'"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: chaos, path: "chaos-*.json" }
